<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плантації Бульбуляндії</title>
<style>
  :root{
    --moss:#2f5d3a; --leaf:#4f8a4b; --sprout:#9bc56b; --meadow:#dcebc2;
    --soil:#6b4a33; --soil-dark:#4d3322; --berry:#d6204a; --berry-dark:#9c1236;
    --paper:#f6f3df; --ink:#23361f; --gold:#e0a21b; --gold-dark:#9a6a08;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:Georgia,"Palatino Linotype",serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 10%,#b9d98a 0,transparent 40%),
      radial-gradient(circle at 85% 90%,#8dbd72 0,transparent 45%),
      linear-gradient(180deg,#cfe6a8,#a6cf84);
    display:flex;align-items:center;justify-content:center;
    padding:12px;user-select:none;-webkit-user-select:none;
  }
  .farm{
    width:min(100%,560px);
    background:var(--paper);
    border:6px solid var(--soil);
    border-radius:22px;
    box-shadow:0 10px 0 var(--soil-dark),0 22px 40px rgba(35,54,31,.35);
    padding:18px 18px 22px;
    position:relative;overflow:hidden;
  }
  h1{
    font-size:clamp(1.5rem,6vw,2.2rem);
    text-align:center;color:var(--moss);
    letter-spacing:.5px;line-height:1.1;
  }
  .sub{text-align:center;font-style:italic;color:var(--leaf);margin:4px 0 12px;font-size:.95rem}
  .hud{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
  .hud div{
    background:var(--meadow);border:2px solid var(--leaf);border-radius:12px;
    padding:6px 2px;text-align:center;font-size:.68rem;color:var(--moss);
  }
  .hud b{display:block;font-size:1.2rem;color:var(--ink);transition:transform .15s}
  .hud b.bump{transform:scale(1.35)}
  .hud b.lost{color:var(--berry);transform:scale(.8)}
  .hud b.danger{color:var(--berry)}
  .field{
    position:relative;margin:0 auto;
    width:min(100%,460px);aspect-ratio:1/1;
    background:var(--soil);border-radius:16px;padding:8px;
    border:4px solid var(--soil-dark);
    box-shadow:inset 0 0 18px rgba(0,0,0,.4);
  }
  .grid{display:grid;gap:6px;width:100%;height:100%}
  .cell{
    position:relative;border:none;cursor:pointer;
    border-radius:12px;
    background:
      repeating-linear-gradient(90deg,transparent 0 10px,rgba(0,0,0,.08) 10px 12px),
      linear-gradient(180deg,#8a6444,#74502f);
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;
    overflow:visible;-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .cell.wrong{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .bush,.bomb{
    width:94%;height:94%;pointer-events:none;overflow:visible;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));
    animation:grow .16s cubic-bezier(.2,1.6,.4,1) both;
  }
  .bomb{width:88%;height:88%}
  @keyframes grow{from{transform:scale(0) rotate(-12deg)}to{transform:scale(1) rotate(0)}}
  .bush.picked{animation:pick .25s ease-out forwards}
  @keyframes pick{to{transform:scale(1.35) translateY(-14px);opacity:0}}
  .bush.burst{animation:boom .55s ease-out forwards}
  .bush.burst .drup{fill:url(#gBurst)}
  @keyframes boom{
    0%{transform:scale(1);filter:none}
    25%{transform:scale(1.4);filter:brightness(1.2) saturate(2.5) drop-shadow(0 0 12px #ff1744)}
    60%{transform:scale(1.7);opacity:.8;filter:saturate(3) hue-rotate(-10deg)}
    100%{transform:scale(2.1);opacity:0}
  }
  .bomb.explode{animation:bombBoom .55s ease-out forwards}
  @keyframes bombBoom{
    0%{transform:scale(1);filter:none}
    30%{transform:scale(1.6);filter:brightness(.8) drop-shadow(0 0 16px #8a3fe0)}
    100%{transform:scale(2.4);opacity:0;filter:brightness(.3) drop-shadow(0 0 22px #2a0a50)}
  }
  .fuse{animation:blink .22s infinite alternate;transform-box:fill-box;transform-origin:center}
  @keyframes blink{from{opacity:.55;transform:scale(.8)}to{opacity:1;transform:scale(1.25)}}
  .timer{
    position:absolute;left:10%;right:10%;bottom:5px;height:5px;border-radius:3px;
    background:rgba(0,0,0,.3);overflow:hidden;pointer-events:none;
  }
  .timer i{display:block;height:100%;background:var(--sprout);transform-origin:left;animation:drain .5s linear forwards}
  @keyframes drain{from{transform:scaleX(1);background:var(--sprout)}to{transform:scaleX(0);background:var(--berry)}}
  .spark{
    position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;
    background:var(--berry);pointer-events:none;z-index:5;
    animation:fly .6s ease-out forwards;
  }
  @keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  .flash{animation:flash .4s}
  @keyframes flash{30%{box-shadow:inset 0 0 0 100vmax rgba(214,32,74,.35)}}
  .flashBomb{animation:flashBomb .45s}
  @keyframes flashBomb{30%{box-shadow:inset 0 0 0 100vmax rgba(70,20,120,.5)}}

  /* ---------- Оверлеї ---------- */
  .overlay{
    position:absolute;inset:0;z-index:20;
    background:rgba(246,243,223,.97);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;gap:12px;overflow-y:auto;
  }
  .overlay.hidden{display:none}
  .overlay.scroll{justify-content:flex-start;padding:70px 18px 24px}
  .overlay h2{font-size:1.7rem;color:var(--moss)}
  .overlay p{max-width:40ch;line-height:1.45}
  .overlay.fail h2{color:var(--berry)}
  .big{font-size:3.2rem;font-weight:bold;color:var(--berry);line-height:1}
  .stats{display:grid;gap:10px;width:100%;max-width:340px}
  .stat{background:var(--meadow);border:2px solid var(--leaf);border-radius:14px;padding:10px}
  .stat small{display:block;color:var(--moss)}
  .stat strong{font-size:2rem}
  .earned{font-weight:bold;color:var(--gold-dark);font-size:1.1rem}

  .coin{
    display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px;
    background:radial-gradient(circle at 35% 30%,#ff9bb0,#d6204a 55%,#7d0c2b);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.35);
  }
  .coinChip{
    position:absolute;top:12px;right:12px;z-index:3;
    background:var(--meadow);border:3px solid var(--leaf);border-radius:22px;
    padding:6px 14px;font-weight:bold;color:var(--ink);box-shadow:0 3px 0 var(--moss);
    display:flex;gap:7px;align-items:center;
  }
  .helpBtn{
    position:absolute;top:12px;left:12px;z-index:3;width:44px;height:44px;border-radius:50%;
    font:inherit;font-weight:bold;font-size:1.4rem;cursor:pointer;
    background:var(--meadow);color:var(--moss);border:3px solid var(--leaf);
    box-shadow:0 3px 0 var(--moss);
  }
  .helpBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--moss)}

  /* ---------- Меню-сцена ---------- */
  .overlay.menu{
    justify-content:flex-start;padding:66px 20px 0;gap:10px;
    background:linear-gradient(180deg,#bfe5f5 0%,#eaf5d0 48%,#b6d98a 100%);
  }
  .scene{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .sun{
    position:absolute;top:70px;right:56px;width:70px;height:70px;border-radius:50%;
    background:radial-gradient(circle,#fff6b0 30%,#ffd84a 70%);
    box-shadow:0 0 0 10px rgba(255,230,100,.35),0 0 40px 18px rgba(255,230,100,.45);
    animation:sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse{50%{transform:scale(1.07)}}
  .cloud{position:absolute;height:22px;border-radius:20px;background:rgba(255,255,255,.85);filter:blur(.5px)}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
  .cloud::before{width:28px;height:28px;left:12px;top:-14px}
  .cloud::after{width:36px;height:36px;left:34px;top:-20px}
  .c1{top:140px;width:80px;animation:drift 38s linear infinite}
  .c2{top:100px;width:60px;animation:drift 52s linear infinite;animation-delay:-20s;opacity:.8}
  @keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(640px)}}
  .hills{position:absolute;left:0;bottom:0;width:100%;height:44%}
  .mb{position:absolute;bottom:3%;aspect-ratio:1/1;transform-origin:50% 95%;animation:sway 3.2s ease-in-out infinite}
  .mb .bush,.mb .bomb{width:100%;height:100%;animation:none}
  @keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
  .mb.pop{animation:sway 3.2s ease-in-out infinite,peek 2.4s ease-in-out infinite}
  @keyframes peek{0%,100%{translate:0 6%}50%{translate:0 -3%}}

  .menuTitle,.menuBtns,.records{position:relative;z-index:1}
  .menuTitle h2{
    font-size:clamp(2.1rem,9vw,3.1rem);line-height:1;color:var(--moss);letter-spacing:1px;
    text-shadow:0 3px 0 #fff,0 6px 10px rgba(35,54,31,.25);
  }
  .menuTitle h2 + h2{font-size:clamp(1.5rem,6.4vw,2.2rem);margin-top:4px;color:var(--berry-dark)}
  .menuTitle p{margin:10px auto 0;font-style:italic;color:var(--moss)}
  .menuBtns{display:flex;flex-direction:column;gap:12px;margin-top:14px;width:min(100%,300px)}
  .records{
    margin-top:4px;background:rgba(246,243,223,.9);border:2px solid var(--leaf);border-radius:12px;
    padding:6px 12px;font-size:.82rem;color:var(--moss);max-width:360px;
  }
  button.btn{
    font:inherit;font-weight:bold;font-size:1.1rem;cursor:pointer;
    background:var(--leaf);color:#fff;border:none;border-radius:14px;
    padding:12px 28px;box-shadow:0 5px 0 var(--moss);
    transition:transform .1s,box-shadow .1s;
  }
  button.btn:hover{background:#5a9a55}
  button.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--moss)}
  button.btn.play{font-size:1.5rem;padding:14px 28px;background:var(--berry);box-shadow:0 6px 0 var(--berry-dark)}
  button.btn.play:hover{background:#e5305a}
  button.btn.play:active{box-shadow:0 1px 0 var(--berry-dark)}
  button.btn.gold{background:var(--gold);box-shadow:0 5px 0 var(--gold-dark);color:#3a2600}
  button.btn.gold:hover{background:#efb232}
  button.btn:disabled{background:#b9b9a5;box-shadow:0 5px 0 #8c8c78;color:#fff;cursor:not-allowed}
  button.btn.small{font-size:.95rem;padding:8px 14px;box-shadow:0 4px 0 var(--moss)}
  button.btn.gold.small{box-shadow:0 4px 0 var(--gold-dark)}
  button.btn.small:disabled{box-shadow:0 4px 0 #8c8c78}
  button:focus-visible{outline:3px solid #ffb300;outline-offset:3px}

  /* ---------- Допомога та прокачка ---------- */
  .help{text-align:left;width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px;margin:0 auto}
  .help h2{text-align:center}
  .help ul{padding-left:20px;line-height:1.45;font-size:.95rem}
  .help li{margin-bottom:4px}
  table.tbl{width:100%;border-collapse:collapse;font-size:.8rem;text-align:center}
  .tbl th{background:var(--leaf);color:#fff;padding:6px 3px;font-weight:bold}
  .tbl td{background:var(--meadow);padding:6px 3px;border-bottom:2px solid var(--paper)}
  .help .btn{align-self:center}
  .note{font-size:.8rem;color:var(--moss);text-align:center}
  .up{
    display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;
    background:var(--meadow);border:2px solid var(--leaf);border-radius:14px;padding:10px 12px;
  }
  .up h3{font-size:1.05rem;color:var(--moss)}
  .up p{font-size:.82rem;line-height:1.35;max-width:none}
  .up .now{font-size:.8rem;color:var(--gold-dark);font-weight:bold}
  .pips{display:flex;gap:4px;margin-top:4px}
  .pip{width:16px;height:10px;border-radius:5px;background:#c3d3a5;border:1px solid var(--leaf)}
  .pip.on{background:var(--berry);border-color:var(--berry-dark)}
  .pip.fresh{animation:pipPop .5s ease-out}
  @keyframes pipPop{0%{transform:scale(.3)}60%{transform:scale(1.6)}100%{transform:scale(1)}}
  .legend{margin-top:12px;text-align:center;font-size:.9rem;color:var(--moss);min-height:1.3em}
  @media (prefers-reduced-motion:reduce){
    .bush,.bush.burst,.bush.picked,.bomb,.bomb.explode,.spark,.cell.wrong,.fuse,
    .sun,.cloud,.mb,.mb.pop,.pip.fresh{animation-duration:.01s;animation-iteration-count:1}
  }
  .nick{width:min(100%,260px);font:inherit;font-size:1.2rem;text-align:center;padding:10px 12px;border:3px solid var(--leaf);border-radius:12px;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
  .acct{position:relative;z-index:1;font-size:.78rem;color:var(--moss);margin-top:2px;max-width:340px}
  .alink{font:inherit;font-size:.85rem;background:none;border:none;color:var(--moss);text-decoration:underline;cursor:pointer;padding:2px 4px}
  .code{width:min(100%,380px);font:.8rem monospace;padding:8px;border:3px solid var(--leaf);border-radius:12px;resize:none;user-select:text;-webkit-user-select:text;word-break:break-all;background:#fff;color:var(--ink)}
  .grid.dense .cell{border-radius:4px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
  .grid.dense .timer{height:3px;bottom:1px;left:6%;right:6%}
  .menuBtns .row{display:flex;gap:10px}
  .menuBtns .row .btn{flex:1;padding:10px 8px;font-size:1rem}
  .switch{display:flex;align-items:center;gap:10px;background:rgba(246,243,223,.92);border:2px solid var(--leaf);
    border-radius:12px;padding:6px 10px;text-align:left;font-size:.78rem;color:var(--moss);cursor:pointer;line-height:1.25;position:relative}
  .switch input{position:absolute;opacity:0;pointer-events:none}
  .switch .sl{flex:none;width:42px;height:24px;border-radius:12px;background:#b9b9a5;position:relative;transition:background .2s}
  .switch .sl::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
    transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.4)}
  .switch input:checked + .sl{background:var(--leaf)}
  .switch input:checked + .sl::after{transform:translateX(18px)}
  .switch input:focus-visible + .sl{outline:3px solid #ffb300;outline-offset:2px}
  .tbl tr.me td{background:#f9e3a8;font-weight:bold}
  .tree{width:100%;max-width:470px;margin:0 auto}
  .tree svg{width:100%;height:auto;display:block}
  .tnode{cursor:pointer}
  .tnode circle.bg{fill:#dcebc2;stroke:#4f8a4b;stroke-width:3}
  .tnode .ico{color:#2f5d3a}
  .tnode.locked circle.bg{fill:#d6d6c8;stroke:#a3a393}
  .tnode.locked .ico{color:#9a9a8c}
  .tnode.can circle.bg{stroke:#d6204a;animation:ring 1.6s ease-in-out infinite}
  .tnode.max circle.bg{fill:#ffe9a3;stroke:#e0a21b}
  .tnode.max .ico{color:#9a6a08}
  .tnode.sel circle.bg{stroke-width:6}
  @keyframes ring{50%{stroke-width:6}}
  .tnode text{font-size:10px;fill:#23361f;text-anchor:middle;font-family:inherit;pointer-events:none}
  .tnode text.lvl{font-size:9px;font-weight:bold;fill:#fff}
  .tedge{fill:none;stroke:#a3a393;stroke-width:3;stroke-dasharray:5 4}
  .tedge.on{stroke:#4f8a4b;stroke-dasharray:none}
  .tdetail{background:var(--meadow);border:2px solid var(--leaf);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px}
  .tdetail h3{color:var(--moss)}
  .tdetail p{font-size:.85rem;max-width:none}
  .tdetail ul{list-style:none;font-size:.8rem}
  .tdetail li.ok{color:var(--moss)} .tdetail li.no{color:var(--berry-dark)}
  .goldy{filter:drop-shadow(0 0 7px #ffd54a) drop-shadow(0 3px 2px rgba(0,0,0,.35))}
  .admin{position:fixed;inset:0;z-index:100;background:#10180f;color:#e8f2d8;overflow:auto;padding:14px;font:14px/1.4 Georgia,serif;text-align:left}
  .admin h2{color:#9bc56b;margin:10px 0 6px}
  .admin table{width:100%;border-collapse:collapse;font-size:12px}
  .admin th,.admin td{border-bottom:1px solid #2c3a2a;padding:5px 4px;text-align:left;vertical-align:top;word-break:break-all}
  .admin input,.admin textarea{background:#1b2a1a;color:#e8f2d8;border:1px solid #4f8a4b;border-radius:6px;padding:5px;font:inherit;user-select:text;-webkit-user-select:text}
  .admin button{background:#4f8a4b;color:#fff;border:0;border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit;margin:1px}
  .admin button.danger{background:#b3203f}
  .admin .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
  .admin label{display:flex;flex-direction:column;font-size:11px;gap:2px}
  .screamer{position:fixed;inset:0;z-index:200;background:#000;display:flex;align-items:center;justify-content:center}
  .screamer svg{width:min(92vw,92vh);animation:scare 3.4s ease-out forwards}
  @keyframes scare{0%{transform:scale(.15)}10%{transform:scale(1)}100%{transform:scale(1.18)}}
  .screamer button{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:#222;color:#fff;font-size:1.3rem;cursor:pointer}
  @media (prefers-reduced-motion:reduce){.screamer svg{animation:none}}
</style>
</head>
<body>

<!-- Градієнти (оголошені один раз) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gDrup" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ff7b98"/><stop offset=".4" stop-color="#e0214f"/><stop offset="1" stop-color="#7d0c2b"/>
    </radialGradient>
    <radialGradient id="gDrupDark" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#e8456d"/><stop offset=".45" stop-color="#b8153d"/><stop offset="1" stop-color="#650a22"/>
    </radialGradient>
    <radialGradient id="gBurst" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ffd0c8"/><stop offset=".4" stop-color="#ff1744"/><stop offset="1" stop-color="#b00000"/>
    </radialGradient>
    <radialGradient id="gBlack" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#7a6aa8"/><stop offset=".35" stop-color="#34205a"/><stop offset=".75" stop-color="#150a28"/><stop offset="1" stop-color="#05020a"/>
    </radialGradient>
    <linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6b3a"/><stop offset="1" stop-color="#7ec26a"/>
    </linearGradient>
    <linearGradient id="gLeafDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#244f2d"/><stop offset="1" stop-color="#4f9448"/>
    </linearGradient>
  </defs>
</svg>

<main class="farm" id="farm">
  <h1>Плантації Бульбуляндії</h1>
  <p class="sub">Збери малину, обережно з ожиною-бомбою!</p>

  <section class="hud" aria-live="polite">
    <div>Рівень<b id="hLevel">1/5</b></div>
    <div>Зібрано<b id="hScore">0</b></div>
    <div>Серія<b id="hStreak">0</b></div>
    <div>Рекорд серії<b id="hBest">0</b></div>
    <div>Лопнуло<b id="hLives">0/2</b></div>
  </section>

  <div class="field" id="field"><div class="grid" id="grid"></div></div>
  <p class="legend" id="legend"></p>

  <div class="overlay" id="overlay"></div>
</main>

<script>
(() => {
  "use strict";

  // ---------- Налаштування рівнів ----------
  // Час життя куща (мс) лінійно скорочується від "from" до "to" протягом рівня.
  // maxBurst — скільки разів можна лопнути; "більше" = програш рівня.
  // bombChance/maxBombs — шанс і максимум ожин-бомб одночасно з кущем.
  const LEVELS = [
    { n: 1,  count: 5,  from: 500, to: 500, maxBurst: 2, bombChance: 0,    maxBombs: 0 },  // 0 — розминка 1×1 (необов’язкова)
    { n: 2,  count: 8,  from: 450, to: 380, maxBurst: 2, bombChance: 0.30, maxBombs: 1 },
    { n: 3,  count: 10, from: 400, to: 330, maxBurst: 3, bombChance: 0.45, maxBombs: 2 },
    { n: 5,  count: 12, from: 380, to: 300, maxBurst: 5, bombChance: 0.60, maxBombs: 2 },
    { n: 8,  count: 14, from: 420, to: 340, maxBurst: 6, bombChance: 0.65, maxBombs: 3 },
    { n: 16, count: 16, from: 500, to: 400, maxBurst: 8, bombChance: 0.70, maxBombs: 4 }

      calyx += `<ellipse cx="0" cy="${(-5 * s).toFixed(1)}" rx="${(1.6 * s).toFixed(1)}" ry="${(5.2 * s).toFixed(1)}" fill="#3f8a45" stroke="#2a5f30" stroke-width=".4" transform="rotate(${a + 90} 0 0)"/>`;
    }
    out += `<g transform="translate(${cx} ${ty.toFixed(1)})">${calyx}<circle r="${(1.6 * s).toFixed(1)}" fill="#2a5f30"/></g>`;
    return out;
  }

  function leaf(angle, len, wid, dark) {
    const top = [], bot = [], teeth = 12;
    for (let i = 0; i <= teeth; i++) {
      const t = i / teeth, x = len * t;
      const w = wid * Math.sin(Math.PI * Math.pow(t, 0.8)) * (i % 2 ? 0.78 : 1);
      top.push(`${x.toFixed(1)},${(-w).toFixed(1)}`);
      bot.unshift(`${x.toFixed(1)},${w.toFixed(1)}`);
    }
    let veins = `<path d="M0 0 L${len} 0" stroke="#1f4a28" stroke-width="1" opacity=".7" fill="none"/>`;
    for (let i = 2; i < teeth; i += 2) {
      const x = len * i / teeth, w = wid * Math.sin(Math.PI * Math.pow(i / teeth, 0.8)) * 0.8;
      veins += `<path d="M${x.toFixed(1)} 0 L${(x + 5).toFixed(1)} ${(-w).toFixed(1)} M${x.toFixed(1)} 0 L${(x + 5).toFixed(1)} ${w.toFixed(1)}" stroke="#1f4a28" stroke-width=".6" opacity=".55" fill="none"/>`;
    }
    return `<g transform="translate(50 92) rotate(${angle})">
      <polygon points="${top.concat(bot).join(" ")}" fill="url(#${dark ? G.ld : G.ll})" stroke="#1f4a28" stroke-width=".8" stroke-linejoin="round"/>${veins}</g>`;
  }

  function buildBush() {
    let s = `<svg class="bush" viewBox="0 0 100 100" aria-hidden="true">`;
    s += `<ellipse cx="50" cy="95" rx="32" ry="5" fill="rgba(0,0,0,.28)"/>`;
    [[-168, 36], [-12, 36], [-145, 42], [-35, 42]].forEach(([a, l]) => s += leaf(a, l, 9, true));
    [[-120, 40], [-60, 40], [-95, 34]].forEach(([a, l]) => s += leaf(a, l, 8.5, false));
    s += `<g stroke="#3b6a34" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M50 92 C50 80 50 70 50 50"/>
      <path d="M50 88 C44 80 36 72 30 58"/>
      <path d="M50 88 C56 80 64 72 70 58"/></g>`;
    s += berry(28, 66, 0.78, G.d, "#5a0a20", 0.7);
    s += berry(72, 66, 0.78, G.d, "#5a0a20", 0.7);
    s += berry(50, 56, 1.02, G.l, "#5a0a20", 0.7);
    return s + `</svg>`;
  }

  function buildBomb(gold) {
    let s = `<svg class="bomb" viewBox="0 0 100 100" aria-hidden="true">`;
    s += `<ellipse cx="50" cy="94" rx="28" ry="5" fill="rgba(0,0,0,.3)"/>`;
    s += berry(50, 64, 1.18, G.k, gold ? "#6b4a00" : "#05020a", 0.55);
    if (!gold) s += `<path d="M50 28 C52 20 58 15 64 10" stroke="#6b4a33" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    if (!gold) s += `<circle class="fuse" cx="65" cy="9" r="5" fill="#ffcf33"/>`;
    if (!gold) s += `<circle class="fuse" cx="65" cy="9" r="2.4" fill="#ff7a00"/>`;
    if (gold) s += `<polygon points="80,8 82,14 88,14 83,18 85,24 80,20 75,24 77,18 72,14 78,14" fill="#fff3a0"/><polygon points="14,20 15.5,24 20,24 16.5,27 18,31 14,28.5 10,31 11.5,27 8,24 12.5,24" fill="#fff3a0"/>`;
    return s + `</svg>`;
  }

  const BUSH_SVG = buildBush(), BOMB_SVG = buildBomb();

  // Динамічний рендер: у кожної ягоди трохи інші відтінок і градієнт (проти ботів, які шукають фіксований RGB)
  const hsl = (h, s, l) => `hsl(${Math.round(((h % 360) + 360) % 360)},${Math.round(s)}%,${Math.round(l)}%)`;
  function dynBerry(kind) {
    const id = Math.random().toString(36).slice(2, 8), r = a => (Math.random() - 0.5) * a;
    const hue = kind === "blue" ? 214 : kind === "gold" ? 44 : kind === "bomb" ? 275 : 346;
    const h = hue + r(16);
    const s = (kind === "bomb" ? 38 : 72) + r(12), l = (kind === "bomb" ? 24 : 52) + r(8);
    const grad = (n, dl) => `<radialGradient id="${n}${id}" cx="36%" cy="30%" r="75%"><stop offset="0" stop-color="${hsl(h, s - 10, l + 22 + dl)}"/>`
      + `<stop offset=".42" stop-color="${hsl(h, s, l + dl)}"/><stop offset="1" stop-color="${hsl(h, s + 6, l - 24 + dl)}"/></radialGradient>`;
    const lh = 125 + r(30);
    const leafG = (n, a, b) => `<linearGradient id="${n}${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${hsl(lh, 45, a)}"/>`
      + `<stop offset="1" stop-color="${hsl(lh + r(10), 42, b)}"/></linearGradient>`;
    const defs = `<defs>${grad("a", 0)}${grad("b", -8)}${leafG("c", 26, 46)}${leafG("d", 20, 38)}</defs>`;
    const old = { ...G };
    G.l = "a" + id; G.d = "b" + id; G.k = "a" + id; G.ll = "c" + id; G.ld = "d" + id;
    let svg;
    try {
      svg = kind === "gold" ? buildBomb(true).replace('class="bomb"', 'class="bush goldy"')
          : kind === "bomb" ? buildBomb(false) : buildBush();
    } finally { Object.assign(G, old); }
    return svg.replace(/(<svg[^>]*>)/, `$1${defs}`);
  }

  // ---------- Стан гри ----------
  let S;
  function resetState() {
    if (S) clearTimeout(S.timer);
    S = { level: 0, idx: 0, collected: 0, total: 0, streak: 0, best: 0, lvBursts: 0, raw: 0, earned: 0,
          golden: 0, kind: "red", flags: [], moves: [], clicks: [], holds: [], noMove: 0, nClicks: 0, line: 0, fast: 0,
          shield: 0, second: 0, downT: null, downType: "", sus: false, verdict: [],
          rts: [], cells: [], bombs: [], active: null, t0: 0, timer: null, last: -1, busy: true };
  }

  function bump(el, cls) {
    el.classList.remove("bump", "lost");
    void el.offsetWidth;
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 200);
  }

  function updateHud(ev) {
    const L = eff(S.level);
    hLevel.textContent = S.level + "/" + (LEVELS.length - 1);
    hScore.textContent = S.collected;
    hStreak.textContent = S.streak;
    hBest.textContent = S.best;
    hLives.textContent = S.lvBursts + "/" + L.maxBurst;
    hLives.classList.toggle("danger", S.lvBursts >= L.maxBurst);
    if (ev === "up") bump(hStreak, "bump");
    if (ev === "reset") bump(hStreak, "lost");
  }

  function lifeFor(level, idx) {
    const L = eff(level);
    const t = L.count > 1 ? idx / (L.count - 1) : 0;
    return Math.round(L.from + (L.to - L.from) * t);
  }

  function buildLevel() {
    const { n } = LEVELS[S.level];
    grid.innerHTML = "";
    grid.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${n}, 1fr)`;
    grid.classList.toggle("dense", n >= 8);
    grid.style.gap = n >= 8 ? "2px" : "";
    S.cells = [];
    for (let i = 0; i < n * n; i++) {
      const c = document.createElement("button");
      c.className = "cell";
      c.type = "button";
      c.setAttribute("aria-label", "Грядка " + (i + 1));
      c.addEventListener("pointerdown", e => guardClick(e, i));
      grid.appendChild(c);
      S.cells.push(c);
    }
    for (let h = 0; h < 2; h++) {                         // приховані пастки для ботів (людина їх не бачить)
      const trap = document.createElement("button");
      trap.className = "cell trap"; trap.tabIndex = -1; trap.setAttribute("aria-hidden", "true");
      trap.style.cssText = "position:absolute;left:-9999px;top:0;width:40px;height:40px;opacity:0";
      trap.addEventListener("pointerdown", () => flag("honeypot"));
      trap.addEventListener("click", () => flag("honeypot"));
      grid.appendChild(trap);
    }
    S.idx = 0; S.last = -1; S.active = null; S.bombs = []; S.lvBursts = 0;
    S.shield = lv("shield"); S.second = lv("second");
    legend.textContent = `Рівень ${S.level}: сітка ${n}×${n}`;
    updateHud();
  }

  function removeBombs(except) {
    S.bombs.forEach(b => { if (b !== except) S.cells[b].innerHTML = ""; });
  }

  function spawn() {
    const L = eff(S.level), size = S.cells.length;
    let i;
    do { i = Math.floor(Math.random() * size); } while (i === S.last && size > 1);
    S.last = i; S.active = i; S.busy = false;
    S.kind = "red";                                       // рідкісні ягоди з рівня 1
    if (S.level >= 1) {
      const rnd = Math.random(), gc = goldChance();
      if (rnd < gc) S.kind = "gold"; else if (rnd < gc + blueChance()) S.kind = "blue";
    }

    S.bombs = [];
    if (Math.random() < L.bombChance) {
      let k = 1; while (k < L.maxBombs && Math.random() < 0.4) k++;
      const free = [];
      for (let c = 0; c < size; c++) if (c !== i) free.push(c);
      while (k-- > 0 && free.length) {
        const b = free.splice(Math.floor(Math.random() * free.length), 1)[0];
        S.bombs.push(b);
        S.cells[b].innerHTML = dynBerry("bomb");
      }
    }

    let life = lifeFor(S.level, S.idx);
    if (S.kind === "gold") life += 120 * lv("gsense");
    if (S.kind === "blue") life += 80 * lv("bluetm");
    legend.textContent = `Рівень ${S.level} (${L.n}×${L.n}) · кущ ${S.idx + 1}/${L.count} · час: ${life} мс`;
    S.cells[i].innerHTML = dynBerry(S.kind) + `<span class="timer"><i style="animation-duration:${life}ms"></i></span>`;
    S.t0 = performance.now(); S.moves = [];
    S.timer = setTimeout(() => burst(i, null, true), life);
  }

  function onCell(i) {
    if (S.busy || S.active === null) return;
    if (i === S.active) {
      collect(i);
    } else if (S.bombs.includes(i)) {
      burst(S.active, i);
    } else {
      const w = S.cells[i];
      w.classList.remove("wrong"); void w.offsetWidth; w.classList.add("wrong");
      burst(S.active, null);
    }
  }

  function collect(i) {
    const rt = performance.now() - S.t0;
    analyzeMove();
    if (rt < 60 && ++S.fast >= 3) flag("too_fast");
    clearTimeout(S.timer);
    S.busy = true; S.active = null;
    S.rts.push(rt);
    const w = S.kind === "gold" ? 10 : S.kind === "blue" ? 3 : 1;        // вага ягоди: червона 1, синя 3, золота 10
    S.collected += w; S.total += w;
    const prev = S.streak; S.streak += w;
    S.raw += w * (1 + lv("price")) + (Math.floor(S.streak / 5) - Math.floor(prev / 5)) * (2 + lv("streak"));
    if (S.kind === "gold") S.golden++;
    if (S.streak > S.best) S.best = S.streak;
    removeBombs(null);
    const cell = S.cells[i];
    const bush = cell.querySelector(".bush");
    if (bush) bush.classList.add("picked");
    const t = cell.querySelector(".timer"); if (t) t.remove();
    updateHud("up");
    setTimeout(() => { cell.innerHTML = ""; next(); }, GAP);
  }

  function sparks(cell, colors) {
    for (let k = 0; k < 16; k++) {
      const s = document.createElement("span");
      s.className = "spark";
      const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 70;
      s.style.setProperty("--dx", Math.cos(a) * d + "px");
      s.style.setProperty("--dy", Math.sin(a) * d + "px");
      s.style.background = colors[k % colors.length];
      cell.appendChild(s);
    }
  }

  function burst(i, bombIdx, timedOut) {
    if (S.active === null) return;
    clearTimeout(S.timer);
    S.busy = true; S.active = null;
    const gk = S.kind === "gold";
    S.total += gk ? 3 : 1;                          // пропущена золота ожина = 3 втрачені ягоди
    S.streak = 0;                                   // серія безповоротно скидається
    let pen = gk ? 3 : 1;
    if (bombIdx !== null && S.shield > 0) { S.shield--; pen = 0; }            // щит від ожини
    else if (bombIdx === null && timedOut && S.second > 0) { S.second--; pen = 0; }   // другий шанс (лише за таймером)
    S.lvBursts += pen;
    const cell = S.cells[i];
    const bush = cell.querySelector(".bush");
    if (bush) bush.classList.add("burst");
    const t = cell.querySelector(".timer"); if (t) t.remove();
    sparks(cell, ["#d6204a", "#d6204a", "#ff8a80"]);
    removeBombs(bombIdx);
    if (bombIdx !== null) {
      const bc = S.cells[bombIdx], b = bc.querySelector(".bomb");
      if (b) b.classList.add("explode");
      sparks(bc, ["#8a3fe0", "#2a1747", "#ffcf33"]);
    }
    const fl = bombIdx !== null ? "flashBomb" : "flash";
    field.classList.remove("flash", "flashBomb"); void field.offsetWidth; field.classList.add(fl);
    updateHud("reset");
    setTimeout(() => {
      cell.innerHTML = "";
      if (bombIdx !== null) S.cells[bombIdx].innerHTML = "";
      S.bombs = [];
      if (S.lvBursts > eff(S.level).maxBurst) showFail(); else next();
    }, BURST_GAP);
  }

  function next() {
    S.idx++;
    if (S.idx < LEVELS[S.level].count) { spawn(); return; }
    if (S.level < LEVELS.length - 1) { S.level++; showLevelIntro(); }
    else showResults();
  }

  function startLevel() {
    overlay.classList.add("hidden");
    buildLevel();
    S.busy = true;
    setTimeout(spawn, 700);
  }

  // Підсумок забігу: монети, рекорди, збереження
  function finishRun(won) {
    S.verdict = judgeRun();
    S.sus = S.verdict.length > 0;
    if (S.sus) { S.earned = 0; reportFlags(S.verdict); return; }         // підозріла автоматизація — забіг не зараховується
    S.earned = Math.round(S.raw * (1 + 0.25 * lv("gold"))) + (won ? WIN_BONUS + 5 * lv("winb") : 0);
    save.coins += S.earned;
    save.games++;
    save.golden = (save.golden || 0) + S.golden;
    if (S.best > save.best.streak) save.best.streak = S.best;
    if (won) {
      save.wins++;
      const pct = S.total ? Math.round(S.collected / S.total * 100) : 0;
      if (pct > save.best.pct) save.best.pct = pct;
      if (S.rts.length) {
        const avg = Math.round(S.rts.reduce((a, b) => a + b, 0) / S.rts.length);
        if (save.best.avg === null || avg < save.best.avg) save.best.avg = avg;
      }
    }
    persist();
  }

  // ---------- Захист від ботів ----------
  // Стан гри (S, save) живе в замиканні цієї функції й не доступний через window.
  function flag(name) { if (S && S.flags && !S.flags.includes(name)) S.flags.push(name); }

  function guardClick(e, i) {
    e.preventDefault();
    if (!e.isTrusted) { flag("synthetic"); return; }       // програмні кліки (element.click(), dispatchEvent)
    const now = performance.now();
    S.clicks = S.clicks.filter(x => now - x < 1000); S.clicks.push(now);
    if (S.clicks.length > 12) flag("rate");                // нелюдська частота кліків
    S.downT = now; S.downType = e.pointerType || "";
    onCell(i);
  }

  // Траєкторія курсора між появою ягоди й кліком
  function analyzeMove() {
    S.nClicks++;
    if (S.downType === "touch" || LEVELS[S.level].n < 2) return;
    const m = S.moves;
    if (m.length < 2) { S.noMove++; return; }
    let path = 0;
    for (let k = 1; k < m.length; k++) path += Math.hypot(m[k][0] - m[k - 1][0], m[k][1] - m[k - 1][1]);
    const disp = Math.hypot(m[m.length - 1][0] - m[0][0], m[m.length - 1][1] - m[0][1]);
    if (m.length >= 5 && path > 80 && disp / path > 0.997) S.line++;     // ідеально пряма лінія
  }
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };

  // Підсумкова оцінка забігу (поріги консервативні, щоб не карати людей)
  function judgeRun() {
    const f = new Set(S.flags);
    if (S.nClicks >= 12 && S.noMove / S.nClicks >= 0.9) f.add("no_move");
    if (S.nClicks >= 8 && S.line / S.nClicks >= 0.6) f.add("straight");
    if (S.rts.length >= 10 && sd(S.rts) < 4) f.add("rt_jitter");        // надто однакові реакції
    if (S.holds.length >= 10 && (mean(S.holds) < 8 || sd(S.holds) < 1.2)) f.add("hold");   // тривалість натискання
    return [...f];
  }

  // ---------- Екрани ----------
  function show(html, cls) {
    overlay.className = "overlay" + (cls ? " " + cls : "");
    overlay.innerHTML = html;
    overlay.scrollTop = 0;
  }

    $("playBtn").onclick = () => { S.level = save.warm ? 0 : 1; startLevel(); };
    $("shopBtn").onclick = showShop;
    $("helpBtn").onclick = showHelp;
    [["importOldBtn", showOldImport], ["rankBtn", showRank], ["exportBtn", showExport], ["logoutBtn", logout], ["loginBtn", () => showAuth("login")]]
      .forEach(([id, fn]) => { const el = $(id); if (el) el.onclick = fn; });
    { const mt = overlay.querySelector(".menuTitle"); if (mt) mt.onclick = adminTap; }
    const w = $("warm");

  function showShop(sel) {
    const selId = typeof sel === "string" ? sel : shopSel;
    shopSel = selId;
    const sc = overlay.querySelector(".tree") ? overlay.scrollTop : 0;
    const edges = [], nodes = [];
    UPGRADES.forEach(u => {
      const [x, y] = TREE[u.id];
      (u.req || []).forEach(([pid, n]) => {
        const [px, py] = TREE[pid];
        edges.push(`<path class="tedge${lv(pid) >= n ? " on" : ""}" d="M${px} ${py + 26}V${(py + y) / 2}H${x}V${y - 26}"/>`);
      });
    });
    UPGRADES.forEach(u => {
      const [x, y] = TREE[u.id], L = lv(u.id), max = u.costs.length, ok = reqOk(u), maxed = L >= max;
      const can = ok && !maxed && save.coins >= u.costs[L];
      const cls = ["tnode", !ok ? "locked" : maxed ? "max" : can ? "can" : "", u.id === selId ? "sel" : ""].join(" ");
      nodes.push(`<g class="${cls}" data-id="${u.id}" transform="translate(${x} ${y})">
        <circle class="bg" r="26"/><g class="ico" transform="scale(1.25)">${u.icon}</g>
        <text y="43">${u.short}</text>
        ${ok ? `<rect x="8" y="-32" width="28" height="15" rx="7" fill="${maxed ? "#e0a21b" : "#d6204a"}"/><text class="lvl" x="22" y="-21">${L}/${max}</text>`
             : `<text x="17" y="-16" style="font-size:13px">🔒</text>`}
      </g>`);
    });
    const u = UPGRADES.find(x => x.id === selId), L = lv(u.id), max = u.costs.length, ok = reqOk(u), maxed = L >= max;
    const reqs = (u.req || []).map(([id, n]) => {
      const r = UPGRADES.find(x => x.id === id), good = lv(id) >= n;

  // ---- Перенесення старого прогресу у профіль у хмарі ----
  function parseOld(txt) {
    txt = txt.trim();
    let o = null;
    try { o = JSON.parse(txt); } catch (e) {
      try { o = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(txt), c => c.charCodeAt(0)))); } catch (e2) {}
    }
    if (!o || typeof o !== "object") return null;
    if (o.users) {
      const list = Object.values(o.users);
      o = list.find(u => u && u.nick && acc.nick && u.nick.toLowerCase() === acc.nick) || list[0];
      if (!o) return null;
    }
    if (o.data) o = o.data;
    return (o && typeof o === "object" && o.up) ? o : null;
  }
  function mergeOld(o) {
    const n = norm(o);
    save.coins += Math.max(0, Math.floor(Number(n.coins) || 0));
    UPGRADES.forEach(u => { save.up[u.id] = Math.min(u.costs.length, Math.max(save.up[u.id] || 0, Number(n.up[u.id]) || 0)); });
    save.best.pct = Math.max(save.best.pct, Number(n.best.pct) || 0);
    save.best.streak = Math.max(save.best.streak, Number(n.best.streak) || 0);
    if (n.best.avg != null && (save.best.avg == null || n.best.avg < save.best.avg)) save.best.avg = n.best.avg;
    save.wins += Number(n.wins) || 0;
    save.games += Number(n.games) || 0;
    save.oldImported = true;
    persist();
  }

  // ---------- Відбиток браузера та IP (лише для адміністратора) ----------
  let fpCache = null, ipP = null;
  async function getFp() {
    if (fpCache) return fpCache;
    let c = "", gl = "";
    try {
      const cv = document.createElement("canvas"); cv.width = 200; cv.height = 40;
      const x = cv.getContext("2d");
      x.textBaseline = "top"; x.font = "16px Arial"; x.fillStyle = "#f60"; x.fillRect(10, 5, 80, 20);
      x.fillStyle = "#069"; x.fillText("Bulbulandii fp", 4, 12);
      c = cv.toDataURL();
    } catch (e) {}
    try {
      const g = document.createElement("canvas").getContext("webgl");
      const ext = g && g.getExtension("WEBGL_debug_renderer_info");
      gl = ext ? g.getParameter(ext.UNMASKED_VENDOR_WEBGL) + "|" + g.getParameter(ext.UNMASKED_RENDERER_WEBGL) : "";
    } catch (e) {}
    const raw = [navigator.userAgent, navigator.platform, (navigator.languages || []).join(","),
      screen.width + "x" + screen.height + "x" + screen.colorDepth, window.devicePixelRatio,
      Intl.DateTimeFormat().resolvedOptions().timeZone, navigator.hardwareConcurrency, navigator.deviceMemory, c, gl].join("||");
    fpCache = hex(await crypto.subtle.digest("SHA-256", enc.encode(raw))).slice(0, 32);
    return fpCache;
  }
  async function getIp() {
    try {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 4000);
      const r = await fetch("https://api.ipify.org?format=json", { signal: ctl.signal });
      clearTimeout(tm);
      return String((await r.json()).ip || "").slice(0, 64);
    } catch (e) { return ""; }
  }
  // Службовий запис гравця: читає лише адміністратор (правила Firestore). IP не використовується для банів.
  async function savePriv(extraFlags) {
    if (!acc.fb || !fb.auth.currentUser) return;
    try {
      const F = fb.f, uid = fb.auth.currentUser.uid;
      const [ip, fp] = await Promise.all([ipP || (ipP = getIp()), getFp()]);
      const rec = { nick: acc.rec.nick, ip, fp, ua: navigator.userAgent.slice(0, 160), seen: Date.now() };
      if (extraFlags && extraFlags.length) rec.flags = F.arrayUnion(...extraFlags);
      await F.setDoc(F.doc(fb.db, "priv", uid), rec, { merge: true });
    } catch (e) {}
  }
  const reportFlags = f => savePriv(f);

  // ---------- Бани: за профілем (uid) і за відбитком браузера ----------
  async function checkBan(uid) {
    try {
      const fp = await getFp();
      const ids = uid ? [uid, "fp_" + fp] : ["fp_" + fp];
      for (const id of ids) {
        const s = await fb.f.getDoc(fb.f.doc(fb.db, "bans", id));
        if (s.exists()) return { reason: String(s.data().reason || "").slice(0, 200) };
      }
    } catch (e) {}
    return null;
  }
  function showBanned() {

  // ---------- Скрімер: запускає лише адміністратор ----------
  let scrUnsub = null;
  function watchScreamer(uid) {
    try {
      if (scrUnsub) scrUnsub();
      scrUnsub = fb.f.onSnapshot(fb.f.doc(fb.db, "screamers", uid), snap => {
        if (!snap.exists()) return;
        const ts = Number(snap.data().ts) || 0;
        let last = 0;
        try { last = Number(localStorage.getItem("bulb_scr_" + uid)) || 0; } catch (e) {}
        if (ts > last) { try { localStorage.setItem("bulb_scr_" + uid, String(ts)); } catch (e) {} showScreamer(); }
      }, () => {});
    } catch (e) {}
  }
  function showScreamer() {
    if (document.querySelector(".screamer")) return;
    const d = document.createElement("div");
    d.className = "screamer";
    d.innerHTML = `<svg viewBox="0 0 200 200" aria-hidden="true">
      <ellipse cx="100" cy="104" rx="70" ry="88" fill="#cfd2c4"/>
      <path d="M52 40L62 62M148 40L138 62M100 18V44M70 150L84 168M130 150L116 168" stroke="#555" stroke-width="2" fill="none"/>
      <ellipse cx="68" cy="82" rx="22" ry="28" fill="#050505"/><ellipse cx="132" cy="82" rx="22" ry="28" fill="#050505"/>
      <circle cx="68" cy="86" r="5" fill="#d00"/><circle cx="132" cy="86" r="5" fill="#d00"/>
      <path d="M46 150Q100 190 154 150Q100 128 46 150Z" fill="#120000"/>
      <path d="M58 150L64 164L70 148L78 168L86 148L94 170L100 148L106 170L114 148L122 168L130 148L136 164L142 150" fill="#e9e9d8" stroke="#222" stroke-width="1"/>
    </svg><button type="button" aria-label="Закрити" style="display:none">✕</button>`;
    document.body.appendChild(d);
    let ac = null;
    const onKey = e => { if (e.key === "Escape") close(); };
    function close() { d.remove(); document.removeEventListener("keydown", onKey); try { if (ac) ac.close(); } catch (e) {} }
    document.addEventListener("keydown", onKey);
    const btn = d.querySelector("button");
    btn.onclick = close;
    setTimeout(() => { btn.style.display = "block"; }, 1200);   // кнопку «закрити» видно майже одразу, Esc теж працює
    setTimeout(close, 4200);
    try {                                                       // помірна гучність, без стробоскопа
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const t0 = ac.currentTime, g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.28, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.6);
      g.connect(ac.destination);
      const o = ac.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(220, t0); o.frequency.exponentialRampToValueAtTime(40, t0 + 1.4);
      o.connect(g); o.start(t0); o.stop(t0 + 1.6);
      const nb = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.8), ac.sampleRate), data = nb.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      const ns = ac.createBufferSource(); ns.buffer = nb; ns.connect(g); ns.start(t0);
    } catch (e) {}
  }

  // ---------- Адмін-панель ----------
  // Справжній захист — правила Firestore: запис/читання службових даних дозволені лише тому, для кого створено документ admins/<uid>.
  // Пароль нижче — лише додатковий бар'єр в інтерфейсі (у коді зберігається тільки його PBKDF2-хеш).
  const ADM_SALT = "bulbulandii-admin-v1";
  const ADM_HASH = "f86c8a67d48c65c7234cb98ed1e922a8e42b90028e9ce1816913e7eb207e7541";
  let admEl = null, admModal = null, admClicks = [];
  function adminLock() {
    if (admEl) { admEl.remove(); admEl = null; }
    if (admModal) { admModal.remove(); admModal = null; }
  }
  function adminTap() {
    const now = Date.now();
    admClicks = admClicks.filter(x => now - x < 3000); admClicks.push(now);
    if (admClicks.length >= 7) { admClicks = []; adminEntry(); }
  }
  const admLocked = () => (Number(localStorage.getItem("bulb_adm_lock")) || 0) > Date.now();
  function admFail() {
    let n = (Number(localStorage.getItem("bulb_adm_fail")) || 0) + 1;
    if (n >= 3) {
      try { localStorage.setItem("bulb_adm_lock", String(Date.now() + 15 * 60 * 1000)); localStorage.setItem("bulb_adm_fail", "0"); } catch (e) {}
      alert("3 невдалі спроби: доступ заблоковано на 15 хвилин.");
    } else {
      try { localStorage.setItem("bulb_adm_fail", String(n)); } catch (e) {}
      alert("Доступ заборонено.");
    }
  }
  function askPassword() {
    return new Promise(res => {
      adminLock();
      const d = document.createElement("div");
      d.className = "admin"; d.style.cssText += ";display:flex;align-items:center;justify-content:center";
      d.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px;min-width:240px"><b>Пароль адміністратора</b>
        <input type="password" id="admPw" autocomplete="off"><div><button id="admOk">Увійти</button><button id="admNo" class="danger">Скасувати</button></div></div>`;
      document.body.appendChild(d); admModal = d;
      const done = v => { if (admModal) { admModal.remove(); admModal = null; } res(v); };
      d.querySelector("#admOk").onclick = () => done(d.querySelector("#admPw").value);
      d.querySelector("#admNo").onclick = () => done(null);
      d.querySelector("#admPw").onkeydown = e => { if (e.key === "Enter") done(e.target.value); };
      d.querySelector("#admPw").focus();
    });
  }
  async function adminEntry() {
    if (!(acc.fb && fb.ok && fb.auth.currentUser)) { alert("Спочатку увійди в профіль."); return; }
    if (admLocked()) { alert("Доступ тимчасово заблоковано. Спробуй пізніше."); return; }
    let isAdm = false;
    try { isAdm = (await fb.f.getDoc(fb.f.doc(fb.db, "admins", fb.auth.currentUser.uid))).exists(); } catch (e) {}
    if (!isAdm) { admFail(); return; }                       // другий фактор: акаунт зі спеціальним записом у Firestore
    const pw = await askPassword();
    if (pw === null) return;
    const h = await hashPass(pw, ADM_SALT, "pbkdf2");
    if (h !== ADM_HASH) { admFail(); return; }
    try { localStorage.setItem("bulb_adm_fail", "0"); } catch (e) {}
    renderAdmin();
  }
  async function renderAdmin() {
    adminLock();
    admEl = document.createElement("div"); admEl.className = "admin";    // у DOM з'являється лише після перевірки
    admEl.innerHTML = `<h2>Адмін-панель</h2><p>Завантаження…</p>`;
    document.body.appendChild(admEl);
    try {
      const F = fb.f, db = fb.db;
      const [pl, pr, bn] = await Promise.all(["players", "priv", "bans"].map(c => F.getDocs(F.query(F.collection(db, c), F.limit(500)))));
      const priv = {}, bans = {}, players = [];
      pr.forEach(d => { priv[d.id] = d.data(); });
      bn.forEach(d => { bans[d.id] = d.data(); });
      pl.forEach(d => players.push({ uid: d.id, ...d.data() }));
      drawAdmin(players, priv, bans);
    } catch (e) {
      admEl.innerHTML = `<h2>Адмін-панель</h2><p>Помилка: ${esc((e && e.code) || e)}</p><button id="admX">Закрити</button>`;
      admEl.querySelector("#admX").onclick = adminLock;
    }
  }
  function drawAdmin(players, priv, bans) {
    const F = fb.f, db = fb.db, me = fb.auth.currentUser.uid;
    const fmt = x => x ? new Date(x).toLocaleString("uk-UA") : "—";
    players.sort((a, b) => String(a.nick).localeCompare(String(b.nick)));
    const rows = players.map(p => {
      const v = priv[p.uid] || {}, d = norm(p.data || {}), b = !!bans[p.uid], u = esc(p.uid);
      return `<tr><td>${esc(p.nick)}</td><td>${esc(v.ip || "—")}</td><td>${esc((v.fp || "").slice(0, 10) || "—")}</td>
        <td>${esc((v.flags || []).join(", ") || "—")}</td><td>${d.golden || 0}</td><td>${b ? "🚫" : "ok"}</td>
        <td><button data-a="${b ? "unban" : "ban"}" data-u="${u}" class="${b ? "" : "danger"}">${b ? "Розбан" : "Бан"}</button>
        <button data-a="scare" data-u="${u}">Скрімер</button><button data-a="edit" data-u="${u}">Ред.</button></td></tr>`;
    }).join("");
    const banRows = Object.entries(bans).filter(([id]) => !id.startsWith("fp_")).map(([id, b]) => {
      const v = priv[id] || {};
      return `<tr><td>${esc(b.nick || "—")}</td><td>${esc(v.ip || "—")}</td><td>${esc((b.fp || "").slice(0, 10) || "—")}</td>
        <td>${esc(b.reason || "—")}</td><td>${fmt(b.ts)}</td><td><button data-a="unban" data-u="${esc(id)}">Розбан</button></td></tr>`;
    }).join("");
    admEl.innerHTML = `<h2>Адмін-панель</h2>
      <p>IP-адреси показані лише для інформації. Банів за IP немає: бани діють за профілем і відбитком браузера.</p>
      <button id="admX">Закрити</button> <button id="admR">Оновити</button>
      <h2>Гравці</h2>
      <input id="admReason" placeholder="Причина бану" style="width:100%;max-width:340px">
      <div style="overflow:auto"><table><tr><th>Нік</th><th>IP</th><th>Відбиток</th><th>Прапорці</th><th>Золоті</th><th>Бан</th><th>Дії</th></tr>${rows}</table></div>
      <h2>Заблоковані</h2>
      ${banRows ? `<div style="overflow:auto"><table><tr><th>Нік</th><th>IP</th><th>Відбиток</th><th>Причина</th><th>Дата</th><th></th></tr>${banRows}</table></div>` : "<p>Нікого.</p>"}
      <h2>Бан за нікнеймом</h2>
      <input id="admNick" placeholder="Нік гравця"> <button id="admBanNick" class="danger">Забанити</button>
      <div id="admEdit"></div>`;
    const reasonVal = () => (admEl.querySelector("#admReason").value || "порушення правил").slice(0, 200);
    admEl.querySelector("#admX").onclick = adminLock;
    admEl.querySelector("#admR").onclick = renderAdmin;
    const doBan = async uid => {
      const p = players.find(x => x.uid === uid); if (!p) return;
      const fp = (priv[uid] || {}).fp || "";
      const rec = { nick: p.nick, uid, fp, reason: reasonVal(), ts: Date.now() };
      await F.setDoc(F.doc(db, "bans", uid), rec);
      if (fp) await F.setDoc(F.doc(db, "bans", "fp_" + fp), rec);
    };
    const doUnban = async uid => {
      const b = bans[uid] || {};
      await F.deleteDoc(F.doc(db, "bans", uid));
      const fp = b.fp || (priv[uid] || {}).fp;
      if (fp) await F.deleteDoc(F.doc(db, "bans", "fp_" + fp));
    };
    admEl.querySelector("#admBanNick").onclick = async () => {
      const n = admEl.querySelector("#admNick").value.trim().toLowerCase();
      const p = players.find(x => String(x.nick).toLowerCase() === n);
      if (!p) { alert("Гравця з таким ніком не знайдено."); return; }
      if (p.uid === me) { alert("Себе банити не можна."); return; }
      await doBan(p.uid); renderAdmin();
    };
    admEl.querySelectorAll("button[data-a]").forEach(btn => btn.onclick = async () => {
      const a = btn.dataset.a, uid = btn.dataset.u;
      try {
        if (a === "ban") { if (uid === me) { alert("Себе банити не можна."); return; } await doBan(uid); renderAdmin(); }
        else if (a === "unban") { await doUnban(uid); renderAdmin(); }
        else if (a === "scare") {
          const p = players.find(x => x.uid === uid);
          if (confirm("Показати скрімер гравцю " + (p ? p.nick : "") + "?")) {
            await F.setDoc(F.doc(db, "screamers", uid), { ts: Date.now(), by: me });
            alert("Скрімер надіслано.");
          }
        } else if (a === "edit") editPlayer(uid);
      } catch (e) { alert("Помилка: " + ((e && e.code) || e)); }
    });
    function editPlayer(uid) {
      const p = players.find(x => x.uid === uid); if (!p) return;
      const d = norm(p.data || {});
      const f = (id, label, val) => `<label>${label}<input type="number" id="ed_${id}" value="${Number(val) || 0}"></label>`;
      admEl.querySelector("#admEdit").innerHTML = `<h2>Статистика: ${esc(p.nick)}</h2><div class="grid2">
        ${f("coins", "Малинки", d.coins)}${f("golden", "Золоті ожини", d.golden)}${f("wins", "Перемоги", d.wins)}${f("games", "Ігри", d.games)}
        ${f("pct", "Рекорд врожаю %", d.best.pct)}${f("streak", "Рекорд серії", d.best.streak)}
        ${UPGRADES.map(u => f("up_" + u.id, "Дерево: " + u.name + " (0–" + u.costs.length + ")", d.up[u.id])).join("")}
        </div><button id="edSave">Зберегти</button>`;
      const num = (id, lo, hi) => Math.min(hi, Math.max(lo, Math.floor(Number(admEl.querySelector("#ed_" + id).value) || 0)));
      admEl.querySelector("#edSave").onclick = async () => {
        const upd = { "data.coins": num("coins", 0, 1e7), "data.golden": num("golden", 0, 1e6), "data.wins": num("wins", 0, 1e6),
          "data.games": num("games", 0, 1e6), "data.best.pct": num("pct", 0, 100), "data.best.streak": num("streak", 0, 1e6) };
        UPGRADES.forEach(u => { upd["data.up." + u.id] = num("up_" + u.id, 0, u.costs.length); });
        try { await F.updateDoc(F.doc(db, "players", uid), upd); alert("Збережено. Гравець побачить зміни після повторного входу."); renderAdmin(); }
        catch (e) { alert("Помилка: " + ((e && e.code) || e)); }
      };
    }
  }

  async function showRank() {
    show(`<h2>Рейтинг</h2><p class="note">Завантажуємо…</p><button class="alink" id="backBtn">Назад</button>`, "scroll");
    $("backBtn").onclick = showMenu;
    let data, err = "";
    try {
      if (acc.fb) { acc.rec.data = save; await pushFb(); }
      else if (acc.server && acc.rec) { acc.rec.data = save; await pushAcct(); }   // свіжий результат — у рейтинг
      data = await listPlayers();
    } catch (e) {
      data = { rows: [], me: null, shared: false };
      err = "Не вдалося завантажити рейтинг.";
    }
    const rows = data.rows.filter(r => r.games > 0).sort(rankSort).slice(0, 50);
    const notes = ["Місця: за найкращим відсотком зібраного врожаю, далі за швидкістю реакції та серією."];
    if (!data.shared) notes.push("Тут лише профілі цього пристрою: спільний рейтинг працює на сторінці claude.ai.");
    else if (!fb.ok && !srv()) notes.push("Твій результат не потрапить у спільний рейтинг: потрібен доступ Contributor.");
    if (err) notes.push(err);
    const medal = i => ["🥇", "🥈", "🥉"][i] || (i + 1);
    const body = rows.map((r, i) => `<tr class="${r.id === data.me ? "me" : ""}"><td>${medal(i)}</td><td>${esc(r.nick || "—")}</td>`
      + `<td>${r.wins ? r.pct + "%" : "—"}</td><td>${r.avg == null ? "—" : r.avg + " мс"}</td><td>${r.streak || 0}</td><td>${r.golden || 0}</td></tr>`).join("");
    show(`
      <div class="help">
        <h2>Рейтинг</h2>
        ${rows.length
          ? `<table class="tbl"><tr><th>#</th><th>Гравець</th><th>Врожай</th><th>Реакція</th><th>Серія</th><th>Золоті</th></tr>${body}</table>`
          : `<p class="note">Поки що нікого. Пройди гру — і потрапиш у рейтинг!</p>`}
        <p class="note">${notes.map(esc).join(" ")}</p>
        <button class="btn" id="backBtn">Назад</button>
      </div>`, "scroll");
    $("backBtn").onclick = showMenu;
  }

  // Слухачі: рух курсора, тривалість натискання, перемикання вкладки
  field.addEventListener("pointermove", e => {
    if (e.isTrusted && S && S.active !== null && S.moves.length < 400) S.moves.push([e.clientX, e.clientY, performance.now()]);
  });
  field.addEventListener("pointerup", e => {
    if (!e.isTrusted || !S || S.downT == null) return;
    const d = performance.now() - S.downT; S.downT = null;
    if (d < 800) S.holds.push(d);
  });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) return;
    adminLock();                                           // адмінка закривається при втраті фокусу вкладки
    if (S && S.active !== null && !S.busy) burst(S.active, null, false);   // у фоні ягода лопається
  });

  // Старт: перевіряємо сервер (до 6 с), автоматично входимо в профіль, який був активним
  (async () => {
    show(`<h2>Заходимо на плантацію…</h2><p>Перевіряємо сервер.</p>`);
    await Promise.race([Promise.all([initServer(), initFirebase()]), new Promise(r => setTimeout(r, 8000))]);
    try {
      if (fb.ok && fb.auth.currentUser) await fbEnter(fb.auth.currentUser);
      if (fb.ok && !acc.banned) acc.banned = await checkBan(null);
      const k = fb.ok ? null : accounts.current;
      if (k) {
        const rec = await getAcct(k);
        if (rec && rec.hash === accounts.sessionHash) loginAs(rec);
      }
    } catch (e) {}
    showMenu();
  })();
})();
</script>
</body>
</html>
